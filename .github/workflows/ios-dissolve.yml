# 清除缓存动画（CacheDissolveSheet / CacheDissolveRenderer）的快速预览：只编测试包、只跑 DissolveTests，
# 一打开就是那一屏（-CuvenDissolvePreview YES，演示数据），点「清除」后约每半秒一张截图，
# 提交到 refs/ci/ios-dissolve/<分支>（不是分支；会话里 git fetch 就能取）。约 10 分钟，不用等一小时的完整预览。
name: iOS Dissolve Preview

on:
  push:
    branches: ['claude/**']
    paths: ['ios/Cuven/UI/CacheDissolve*', 'ios/CuvenUITests/DissolveTests.swift', '.github/workflows/ios-dissolve.yml']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ios-dissolve-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frames:
    runs-on: xcode-27
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: 选 Xcode（装着的最新正式版）
        run: |
          XC=$(ls -d /Applications/Xcode_*.app | grep -E 'Xcode_[0-9]+\.[0-9]+(\.[0-9]+)?\.app$' | grep -viE 'beta|release_candidate|_rc' | sort -V | tail -1)
          echo "使用 $XC"
          sudo xcode-select -s "$XC"

      - name: 确保 Metal 工具链
        run: |
          if xcrun metal --version >/dev/null 2>&1; then echo "Metal 工具链已就绪"; else
            xcodebuild -downloadComponent MetalToolchain || sudo xcodebuild -downloadComponent MetalToolchain
          fi

      - name: 生成工程（XcodeGen）
        run: |
          HOMEBREW_NO_AUTO_UPDATE=1 HOMEBREW_NO_INSTALL_CLEANUP=1 brew install xcodegen
          cd ios && xcodegen generate

      - name: 选模拟器（最新 iOS 上的 iPhone Pro）
        run: |
          python3 - <<'PY' >> "$GITHUB_ENV"
          import json, re, subprocess
          d = json.loads(subprocess.check_output(['xcrun', 'simctl', 'list', 'devices', 'available', '-j']))['devices']
          best = None
          for rt, devs in d.items():
              m = re.search(r'iOS-(\d+)-(\d+)', rt)
              if not m:
                  continue
              ver = (int(m.group(1)), int(m.group(2)))
              for dv in devs:
                  n = dv['name']
                  if not n.startswith('iPhone') or 'Duo' in n:
                      continue
                  score = (ver, 'Pro' in n and 'Max' not in n, n)
                  if best is None or score > best[0]:
                      best = (score, dv['udid'])
          print('SIM=' + best[1])
          PY

      - name: 编译测试包
        run: |
          set -o pipefail
          xcodebuild build-for-testing -project ios/Cuven.xcodeproj -scheme Cuven -destination "id=$SIM" \
            -derivedDataPath "$RUNNER_TEMP/dd" > "$RUNNER_TEMP/build.log" 2>&1 || {
              grep -E -B2 -A8 "error:|fatal error" "$RUNNER_TEMP/build.log" | head -200; tail -30 "$RUNNER_TEMP/build.log"; exit 1; }

      - name: 跑 DissolveTests
        run: |
          set +e
          xcrun simctl boot "$SIM" 2>/dev/null; xcrun simctl bootstatus "$SIM" -b > /dev/null 2>&1; sleep 10
          xcodebuild test-without-building -project ios/Cuven.xcodeproj -scheme Cuven -derivedDataPath "$RUNNER_TEMP/dd" \
            -destination "id=$SIM" -only-testing:CuvenUITests/DissolveTests \
            -resultBundlePath "$RUNNER_TEMP/dissolve.xcresult" > "$RUNNER_TEMP/test.log" 2>&1
          echo "exit $?"
          grep -E "Test Case|passed|failed|error:" "$RUNNER_TEMP/test.log" | tail -20

      - name: 截图提交到 refs/ci/ios-dissolve/<分支>
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          OUT="$RUNNER_TEMP/out"
          mkdir -p "$OUT/raw" "$OUT/pub"
          test -d "$RUNNER_TEMP/dissolve.xcresult" || exit 0
          xcrun xcresulttool export attachments --path "$RUNNER_TEMP/dissolve.xcresult" --output-path "$OUT/raw" || true
          python3 - "$OUT" <<'PY'
          import json, os, subprocess, sys
          out = sys.argv[1]
          found = []
          def walk(x):
              if isinstance(x, dict):
                  if 'exportedFileName' in x:
                      found.append((x.get('suggestedHumanReadableName') or '', x['exportedFileName']))
                  for v in x.values(): walk(v)
              elif isinstance(x, list):
                  for v in x: walk(v)
          m = os.path.join(out, 'raw', 'manifest.json')
          if os.path.exists(m):
              walk(json.load(open(m)))
          for human, f in sorted(found):
              if not human.startswith('dissolve-'):
                  continue
              name = human.split('_')[0]
              subprocess.run(['sips', '-s', 'format', 'jpeg', '-s', 'formatOptions', '80', '--resampleWidth', '480',
                              os.path.join(out, 'raw', f), '--out', os.path.join(out, 'pub', name + '.jpg')], check=True, stdout=subprocess.DEVNULL)
              print(name)
          PY
          cd "$OUT/pub"
          [ "$(ls | wc -l)" -gt 0 ] || exit 0
          echo "${GITHUB_SHA} run ${{ github.run_number }}" > SOURCE
          git init -q . && git checkout -q -b dissolve
          git add -A
          git -c user.name=ios-dissolve -c user.email=ios-dissolve@users.noreply.github.com commit -qm "Dissolve frames ${GITHUB_SHA::7}"
          git push -qf "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:refs/ci/ios-dissolve/${GITHUB_REF_NAME}"
          echo "已提交到 refs/ci/ios-dissolve/${GITHUB_REF_NAME}"
