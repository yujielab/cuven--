# 动画的快速预览：只编测试包，只跑 DissolveTests（清除缓存动画：一打开就是那一屏，-CuvenDissolvePreview YES，点「清除」后约每半秒一张）
# 和 RequestFlowTests（请求中心最上面那张「Luminous Data Flow」卡：光点、能量波、进度条、切分类），演示数据，
# 提交到 refs/ci/ios-dissolve/<分支>（不是分支；会话里 git fetch 就能取）。约 10 分钟，不用等一小时的完整预览。
# 还跑 LoginLandingTests（用户要的新登录落地页：开场连拍、终态、账号密码页、光学配对页，截图名以 login- 开头）。
name: iOS Dissolve Preview

on:
  push:
    branches: ['claude/**']
    paths: ['ios/Cuven/UI/CacheDissolve*', 'ios/Cuven/UI/FlowFunnel*', 'ios/Cuven/UI/RequestFlowCard.swift', 'ios/Cuven/UI/RequestCenter.swift',
            'ios/Cuven/Core/RequestBatch.swift', 'ios/Cuven/UI/AllFilmsView.swift', 'ios/CuvenUITests/DissolveTests.swift', 'ios/CuvenUITests/RequestFlowTests.swift',
            'ios/CuvenUITests/AllFilmsTests.swift', 'ios/Cuven/UI/Login*', 'ios/CuvenUITests/LoginLandingTests.swift', '.github/workflows/ios-dissolve.yml']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ios-dissolve-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frames:
    runs-on: xcode-27
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: 选 Xcode（装着的最新正式版）
        run: |
          XC=$(ls -d /Applications/Xcode_*.app | grep -E 'Xcode_[0-9]+\.[0-9]+(\.[0-9]+)?\.app$' | grep -viE 'beta|release_candidate|_rc' | sort -V | tail -1)
          echo "使用 $XC"
          sudo xcode-select -s "$XC"

      - name: 确保 Metal 工具链
        run: |
          if xcrun metal --version >/dev/null 2>&1; then echo "Metal 工具链已就绪"; else
            xcodebuild -downloadComponent MetalToolchain || sudo xcodebuild -downloadComponent MetalToolchain
          fi

      - name: 生成工程（XcodeGen）
        run: |
          HOMEBREW_NO_AUTO_UPDATE=1 HOMEBREW_NO_INSTALL_CLEANUP=1 brew install xcodegen
          cd ios && xcodegen generate

      - name: 选模拟器（iPhone Duo + 最新 iOS 上的 iPhone Pro）
        run: |
          python3 - <<'PY' >> "$GITHUB_ENV"
          import json, re, subprocess
          d = json.loads(subprocess.check_output(['xcrun', 'simctl', 'list', 'devices', 'available', '-j']))['devices']
          best = duo = None
          for rt, devs in d.items():
              m = re.search(r'iOS-(\d+)-(\d+)', rt)
              if not m:
                  continue
              ver = (int(m.group(1)), int(m.group(2)))
              for dv in devs:
                  n = dv['name']
                  if not n.startswith('iPhone'):
                      continue
                  if 'Duo' in n:
                      if duo is None or ver > duo[0]:
                          duo = (ver, dv['udid'])
                      continue
                  score = (ver, 'Pro' in n and 'Max' not in n, n)
                  if best is None or score > best[0]:
                      best = (score, dv['udid'])
          print('SIM=' + best[1])
          if duo:
              print('DUO=' + duo[1])
          PY

      - name: 编译测试包
        run: |
          set -o pipefail
          xcodebuild build-for-testing -project ios/Cuven.xcodeproj -scheme Cuven -destination "id=$SIM" \
            -derivedDataPath "$RUNNER_TEMP/dd" > "$RUNNER_TEMP/build.log" 2>&1 || {
              grep -E -B2 -A8 "error:|fatal error" "$RUNNER_TEMP/build.log" | head -200; tail -30 "$RUNNER_TEMP/build.log"; exit 1; }

      - name: 跑 DissolveTests（iPhone Duo 一遍、普通 iPhone 一遍）
        run: |
          set +e
          run() {
            xcrun simctl boot "$2" 2>/dev/null; xcrun simctl bootstatus "$2" -b > /dev/null 2>&1; sleep 10
            xcodebuild test-without-building -project ios/Cuven.xcodeproj -scheme Cuven -derivedDataPath "$RUNNER_TEMP/dd" \
              -destination "id=$2" -only-testing:CuvenUITests/DissolveTests -only-testing:CuvenUITests/RequestFlowTests -only-testing:CuvenUITests/AllFilmsTests -only-testing:CuvenUITests/LoginLandingTests \
              -resultBundlePath "$RUNNER_TEMP/$1.xcresult" > "$RUNNER_TEMP/$1.log" 2>&1
            echo "$1 exit $?"
            grep -E "Test Case|passed|failed|error:" "$RUNNER_TEMP/$1.log" | tail -10
            xcrun simctl shutdown "$2" 2>/dev/null
          }
          if [ -n "${DUO:-}" ]; then run duo "$DUO"; fi
          run phone "$SIM"

      - name: 截图提交到 refs/ci/ios-dissolve/<分支>
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          OUT="$RUNNER_TEMP/out"
          mkdir -p "$OUT/pub"
          for dev in duo phone; do
            test -d "$RUNNER_TEMP/$dev.xcresult" || continue
            mkdir -p "$OUT/raw-$dev"
            xcrun xcresulttool export attachments --path "$RUNNER_TEMP/$dev.xcresult" --output-path "$OUT/raw-$dev" || true
          done
          python3 - "$OUT" <<'PY'
          import json, os, subprocess, sys
          out = sys.argv[1]
          for dev in ('duo', 'phone'):
              raw = os.path.join(out, 'raw-' + dev)
              m = os.path.join(raw, 'manifest.json')
              if not os.path.exists(m):
                  continue
              found = []
              def walk(x):
                  if isinstance(x, dict):
                      if 'exportedFileName' in x:
                          found.append((x.get('suggestedHumanReadableName') or '', x['exportedFileName']))
                      for v in x.values(): walk(v)
                  elif isinstance(x, list):
                      for v in x: walk(v)
              walk(json.load(open(m)))
              for human, f in sorted(found):
                  if not human.startswith(('dissolve-', 'flow-', 'films-', 'login-')):
                      continue
                  name = dev + '-' + human.split('_')[0]
                  subprocess.run(['sips', '-s', 'format', 'jpeg', '-s', 'formatOptions', '80', '--resampleWidth', '480',
                                  os.path.join(raw, f), '--out', os.path.join(out, 'pub', name + '.jpg')], check=True, stdout=subprocess.DEVNULL)
                  print(name)
          PY
          cd "$OUT/pub"
          [ "$(ls | wc -l)" -gt 0 ] || exit 0
          echo "${GITHUB_SHA} run ${{ github.run_number }}" > SOURCE
          git init -q . && git checkout -q -b dissolve
          git add -A
          git -c user.name=ios-dissolve -c user.email=ios-dissolve@users.noreply.github.com commit -qm "Dissolve frames ${GITHUB_SHA::7}"
          git push -qf "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:refs/ci/ios-dissolve/${GITHUB_REF_NAME}"
          echo "已提交到 refs/ci/ios-dissolve/${GITHUB_REF_NAME}"
