# iPad 版面预览（用户要求给普通 iPad、iPad Pro 11 / 13 寸定制版面）：只编测试包，在 iPad（A16）、iPad Pro 11 寸、13 寸上
# 各跑一遍 PadLayoutTests（演示数据；竖拿、横拿各截主页、资料库、请求、全部影片），
# 提交到 refs/ci/ios-ipad/<分支>（不是分支；会话里 git fetch 就能取）。
name: iOS iPad Preview

on:
  # 用户要求（2026-11-25）：不再自动做 CI 屏幕截图，改用真机配合调试；只在手动运行（workflow_dispatch）时截图
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ios-ipad-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frames:
    runs-on: xcode-27
    timeout-minutes: 85
    steps:
      - uses: actions/checkout@v4

      - name: 选 Xcode（装着的最新正式版）
        run: |
          XC=$(ls -d /Applications/Xcode_*.app | grep -E 'Xcode_[0-9]+\.[0-9]+(\.[0-9]+)?\.app$' | grep -viE 'beta|release_candidate|_rc' | sort -V | tail -1)
          echo "使用 $XC"
          sudo xcode-select -s "$XC"

      - name: 确保 Metal 工具链
        run: |
          if xcrun metal --version >/dev/null 2>&1; then echo "Metal 工具链已就绪"; else
            xcodebuild -downloadComponent MetalToolchain || sudo xcodebuild -downloadComponent MetalToolchain
          fi

      - name: 生成工程（XcodeGen）
        run: |
          HOMEBREW_NO_AUTO_UPDATE=1 HOMEBREW_NO_INSTALL_CLEANUP=1 brew install xcodegen
          cd ios && xcodegen generate

      - name: 选模拟器（最新 iOS 上的 iPad（A16）、iPad Pro 11 寸、13 寸）
        run: |
          python3 - <<'PY' >> "$GITHUB_ENV"
          import json, re, subprocess
          d = json.loads(subprocess.check_output(['xcrun', 'simctl', 'list', 'devices', 'available', '-j']))['devices']
          pick = {}
          for rt, devs in d.items():
              m = re.search(r'iOS-(\d+)-(\d+)', rt)
              if not m:
                  continue
              ver = (int(m.group(1)), int(m.group(2)))
              for dv in devs:
                  n = dv['name']
                  if not n.startswith('iPad'):
                      continue
                  key = None
                  if 'Pro' in n and '11' in n: key = 'P11'
                  elif 'Pro' in n and '13' in n: key = 'P13'
                  elif re.fullmatch(r'iPad( \(A\d+\)| \(\d+th generation\))?', n): key = 'A16'
                  if key is None:
                      continue
                  score = (ver, n)
                  if key not in pick or score > pick[key][0]:
                      pick[key] = (score, dv['udid'])
          for k, (_, u) in pick.items():
              print(k + '=' + u)
          first = pick.get('P11') or pick.get('A16') or pick.get('P13')
          print('SIM=' + first[1])
          PY

      - name: 编译测试包
        run: |
          set -o pipefail
          xcodebuild build-for-testing -project ios/Cuven.xcodeproj -scheme Cuven -destination "id=$SIM" \
            -derivedDataPath "$RUNNER_TEMP/dd" > "$RUNNER_TEMP/build.log" 2>&1 || {
              grep -E -B2 -A8 "error:|fatal error" "$RUNNER_TEMP/build.log" | head -200; tail -30 "$RUNNER_TEMP/build.log"; exit 1; }

      - name: 跑 PadLayoutTests（三台 iPad）
        run: |
          set +e
          run() {
            [ -n "$2" ] || return 0
            xcrun simctl boot "$2" 2>/dev/null; xcrun simctl bootstatus "$2" -b > /dev/null 2>&1; sleep 10
            xcodebuild test-without-building -project ios/Cuven.xcodeproj -scheme Cuven -derivedDataPath "$RUNNER_TEMP/dd" \
              -destination "id=$2" -only-testing:CuvenUITests/PadLayoutTests \
              -resultBundlePath "$RUNNER_TEMP/$1.xcresult" > "$RUNNER_TEMP/$1.log" 2>&1
            echo "$1 exit $?"
            grep -E "Test Case|passed|failed|error:" "$RUNNER_TEMP/$1.log" | tail -10
            xcrun simctl shutdown "$2" 2>/dev/null
          }
          # 13 寸先跑（以前排在最后，常被下一次推送取消，一直没截到）
          run p13 "${P13:-}"
          run p11 "${P11:-}"
          run a16 "${A16:-}"

      - name: 截图提交到 refs/ci/ios-ipad/<分支>
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          OUT="$RUNNER_TEMP/out"
          mkdir -p "$OUT/pub"
          for dev in a16 p11 p13; do
            test -d "$RUNNER_TEMP/$dev.xcresult" || continue
            mkdir -p "$OUT/raw-$dev"
            xcrun xcresulttool export attachments --path "$RUNNER_TEMP/$dev.xcresult" --output-path "$OUT/raw-$dev" || true
          done
          python3 - "$OUT" <<'PY'
          import json, os, subprocess, sys
          out = sys.argv[1]
          for dev in ('a16', 'p11', 'p13'):
              raw = os.path.join(out, 'raw-' + dev)
              m = os.path.join(raw, 'manifest.json')
              if not os.path.exists(m):
                  continue
              found = []
              def walk(x):
                  if isinstance(x, dict):
                      if 'exportedFileName' in x:
                          found.append((x.get('suggestedHumanReadableName') or '', x['exportedFileName']))
                      for v in x.values(): walk(v)
                  elif isinstance(x, list):
                      for v in x: walk(v)
              walk(json.load(open(m)))
              for human, f in sorted(found):
                  if not human.startswith('pad-'):
                      continue
                  name = dev + '-' + human.split('_')[0]
                  subprocess.run(['sips', '-s', 'format', 'jpeg', '-s', 'formatOptions', '78', '--resampleWidth', '640',
                                  os.path.join(raw, f), '--out', os.path.join(out, 'pub', name + '.jpg')], check=True, stdout=subprocess.DEVNULL)
                  print(name)
          PY
          cd "$OUT/pub"
          [ "$(ls | wc -l)" -gt 0 ] || exit 0
          echo "${GITHUB_SHA} run ${{ github.run_number }}" > SOURCE
          git init -q . && git checkout -q -b ipad
          git add -A
          git -c user.name=ios-ipad -c user.email=ios-ipad@users.noreply.github.com commit -qm "iPad frames ${GITHUB_SHA::7}"
          git push -qf "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:refs/ci/ios-ipad/${GITHUB_REF_NAME}"
          echo "已提交到 refs/ci/ios-ipad/${GITHUB_REF_NAME}"
