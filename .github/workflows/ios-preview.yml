# 在 iOS 模拟器里把 App 主要页面走一遍（ios/CuvenUITests），每一步截图。
# 连的是生产接口，片库 / 海报都是真的。截图：
#   · 挂在本次运行的 Artifacts 里（ios-preview-<n>，原尺寸 PNG）；
#   · 缩成 JPEG 另外提交到引用 refs/ci/ios-preview（不是分支，不进 PR 也不进历史）：
#     git fetch origin refs/ci/ios-preview && git checkout FETCH_HEAD -- .   （在空目录里）
name: iOS Preview

on:
  push:
    branches: ['claude/**']
    paths: ['ios/**', '.github/workflows/ios-preview.yml']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ios-preview-${{ github.ref }}
  cancel-in-progress: true

jobs:
  preview:
    runs-on: macos-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: 选 Xcode（装着的最新正式版）
        run: |
          XC=$(ls -d /Applications/Xcode_*.app | grep -viE 'beta|release_candidate|_rc' | sort -V | tail -1)
          sudo xcode-select -s "$XC"
          xcodebuild -version

      - name: 生成工程（XcodeGen）
        run: |
          HOMEBREW_NO_AUTO_UPDATE=1 HOMEBREW_NO_INSTALL_CLEANUP=1 brew install xcodegen
          cd ios && xcodegen generate

      - name: 选模拟器（最新 iOS 上的 iPhone Pro）
        run: |
          python3 - <<'PY' >> "$GITHUB_ENV"
          import json, re, subprocess, sys
          d = json.loads(subprocess.check_output(['xcrun', 'simctl', 'list', 'devices', 'available', '-j']))['devices']
          best = None
          for rt, devs in d.items():
              m = re.search(r'iOS-(\d+)-(\d+)', rt)
              if not m:
                  continue
              ver = (int(m.group(1)), int(m.group(2)))
              for dv in devs:
                  n = dv['name']
                  if not n.startswith('iPhone'):
                      continue
                  score = (ver, 'Pro' in n and 'Max' not in n, n)
                  if best is None or score > best[0]:
                      best = (score, dv['udid'], n, rt)
          print('SIM_UDID=' + best[1])
          print('使用模拟器', best[2], best[3], file=sys.stderr)
          PY

      - name: 走一遍（UI 测试，带截图）
        run: |
          set +e
          xcodebuild test -project ios/Cuven.xcodeproj -scheme Cuven -destination "id=$SIM_UDID" \
            -resultBundlePath "$RUNNER_TEMP/ui.xcresult" > "$RUNNER_TEMP/test.log" 2>&1
          code=$?
          grep -E "Test Case|passed|failed|error:|XCTAssert|Failing" "$RUNNER_TEMP/test.log" | tail -60 > "$RUNNER_TEMP/test-summary.txt"
          echo "exit $code" >> "$RUNNER_TEMP/test-summary.txt"
          cat "$RUNNER_TEMP/test-summary.txt"
          if [ $code -ne 0 ]; then tail -40 "$RUNNER_TEMP/test.log"; fi
          exit $code

      - name: 导出截图
        if: always()
        run: |
          OUT="$RUNNER_TEMP/shots"
          mkdir -p "$OUT/small"
          test -d "$RUNNER_TEMP/ui.xcresult" || exit 0
          xcrun xcresulttool export attachments --path "$RUNNER_TEMP/ui.xcresult" --output-path "$OUT"
          python3 - "$OUT" <<'PY'
          import json, os, subprocess, sys
          out = sys.argv[1]
          found = []
          def walk(x):
              if isinstance(x, dict):
                  if 'exportedFileName' in x:
                      found.append((x.get('suggestedHumanReadableName') or x['exportedFileName'], x['exportedFileName']))
                  for v in x.values():
                      walk(v)
              elif isinstance(x, list):
                  for v in x:
                      walk(v)
          walk(json.load(open(os.path.join(out, 'manifest.json'))))
          for human, f in sorted(found):
              src = os.path.join(out, f)
              if not f.lower().endswith(('.png', '.jpg', '.jpeg', '.heic')):
                  continue
              name = human.split('_')[0]
              small = os.path.join(out, 'small', name + '.jpg')
              subprocess.run(['sips', '-s', 'format', 'jpeg', '-s', 'formatOptions', '70', '--resampleWidth', '540', src, '--out', small],
                             check=True, stdout=subprocess.DEVNULL)
              os.rename(src, os.path.join(out, name + os.path.splitext(f)[1]))
              print(name, os.path.getsize(small))
          PY

      - name: 截图提交到 refs/ci/ios-preview
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          D="$RUNNER_TEMP/shots/small"
          test -d "$D" || exit 0
          cp "$RUNNER_TEMP/test-summary.txt" "$D/" 2>/dev/null || true
          echo "${GITHUB_SHA} run ${{ github.run_number }}" > "$D/SOURCE"
          cd "$D"
          git init -q . && git checkout -q -b shots
          git add -A
          git -c user.name=ios-preview -c user.email=ios-preview@users.noreply.github.com commit -qm "iOS preview ${GITHUB_SHA::7} · run ${{ github.run_number }}"
          git push -qf "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:refs/ci/ios-preview
          echo "已提交到 refs/ci/ios-preview"

      - name: 上传截图
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-preview-${{ github.run_number }}
          path: ${{ runner.temp }}/shots
          if-no-files-found: ignore
