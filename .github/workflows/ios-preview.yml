# 在 iOS 模拟器里把 App 主要页面走一遍（ios/CuvenUITests），连生产接口，最后试播一部片。
#
# ⚠︎ 这个仓库是公开的：日志、构建产物、引用任何人都看得到，真实片库的截图却是片库的真实内容。所以：
#   · 日志里只有测试是否通过、播放器状态（来源类型 / 就绪 / 进度，不含片名与地址）；
#   · 真实片库的截图默认不上传，只有在 Actions 页手动运行并勾选「上传截图」时才上传，且 3 天后自动删除；
#   · iPhone Duo 那几种形态用演示数据跑（DuoTests：片名、海报、字标都是本地合成的），这部分截图提交到
#     refs/ci/ios-preview-demo（不是分支）：git fetch origin refs/ci/ios-preview-demo && git checkout FETCH_HEAD -- .
#   · 每次运行先删掉以前公开出去的真实片库截图（refs/ci/ios-preview 引用与 ios-preview-* 产物）。
name: iOS Preview

on:
  push:
    branches: ['claude/**']
    paths: ['ios/**', '.github/workflows/ios-preview.yml']
  workflow_dispatch:
    inputs:
      screenshots:
        description: '上传截图（仓库公开：截图里是片库内容，3 天后自动删除）'
        type: boolean
        default: false

permissions:
  contents: write
  actions: write

concurrency:
  group: ios-preview-${{ github.ref }}
  cancel-in-progress: true

jobs:
  preview:
    runs-on: macos-latest
    timeout-minutes: 40
    steps:
      - name: 清理以前公开出去的截图
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api -X DELETE "repos/$GITHUB_REPOSITORY/git/refs/ci/ios-preview" >/dev/null 2>&1 && echo "已删除 refs/ci/ios-preview" || true
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts?per_page=100" --jq '.artifacts[] | select(.name | startswith("ios-preview-")) | .id' \
            | while read -r id; do gh api -X DELETE "repos/$GITHUB_REPOSITORY/actions/artifacts/$id" >/dev/null && echo "已删除截图产物 $id"; done || true

      - uses: actions/checkout@v4

      - name: 选 Xcode（装着的最新正式版）
        run: |
          XC=$(ls -d /Applications/Xcode_*.app | grep -viE 'beta|release_candidate|_rc' | sort -V | tail -1)
          sudo xcode-select -s "$XC"
          xcodebuild -version

      - name: 生成工程（XcodeGen）
        run: |
          HOMEBREW_NO_AUTO_UPDATE=1 HOMEBREW_NO_INSTALL_CLEANUP=1 brew install xcodegen
          cd ios && xcodegen generate

      - name: 选模拟器（最新 iOS 上最宽的 iPhone：Pro Max，最接近 Duo 外屏的宽度）
        run: |
          python3 - <<'PY' >> "$GITHUB_ENV"
          import json, re, subprocess, sys
          d = json.loads(subprocess.check_output(['xcrun', 'simctl', 'list', 'devices', 'available', '-j']))['devices']
          best = None
          for rt, devs in d.items():
              m = re.search(r'iOS-(\d+)-(\d+)', rt)
              if not m:
                  continue
              ver = (int(m.group(1)), int(m.group(2)))
              for dv in devs:
                  n = dv['name']
                  if not n.startswith('iPhone'):
                      continue
                  score = (ver, 'Pro Max' in n, 'Pro' in n, n)
                  if best is None or score > best[0]:
                      best = (score, dv['udid'], n, rt)
          print('SIM_UDID=' + best[1])
          print('使用模拟器', best[2], best[3], file=sys.stderr)
          PY

      - name: 走一遍（UI 测试）
        run: |
          set +e
          xcodebuild test -project ios/Cuven.xcodeproj -scheme Cuven -destination "id=$SIM_UDID" \
            -resultBundlePath "$RUNNER_TEMP/ui.xcresult" > "$RUNNER_TEMP/test.log" 2>&1
          code=$?
          grep -E "Test Case|passed|failed|error:|XCTAssert|Failing" "$RUNNER_TEMP/test.log" | tail -60
          echo "exit $code"
          if [ $code -ne 0 ]; then tail -40 "$RUNNER_TEMP/test.log"; fi
          exit $code

      - name: 播放器与性能日志（来源 / 就绪 / 进度、数量与耗时、主线程卡顿，不含片名与地址）
        if: always()
        run: |
          xcrun simctl spawn "$SIM_UDID" log show --last 40m --style compact \
            --predicate 'subsystem == "us.cuven.tv" AND category == "player"' 2>/dev/null | tail -60 || true
          echo "---- perf ----"
          xcrun simctl spawn "$SIM_UDID" log show --last 40m --style compact \
            --predicate 'subsystem == "us.cuven.tv" AND category == "perf"' 2>/dev/null | tail -250 || true

      - name: Duo 演示截图（只含合成内容）提交到 refs/ci/ios-preview-demo
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          OUT="$RUNNER_TEMP/demo"
          mkdir -p "$OUT/pub"
          test -d "$RUNNER_TEMP/ui.xcresult" || exit 0
          xcrun xcresulttool export attachments --path "$RUNNER_TEMP/ui.xcresult" --output-path "$OUT"
          python3 - "$OUT" <<'PY'
          import json, os, subprocess, sys
          out = sys.argv[1]
          found = []
          def walk(x):
              if isinstance(x, dict):
                  if 'exportedFileName' in x:
                      found.append((x.get('suggestedHumanReadableName') or '', x['exportedFileName']))
                  for v in x.values():
                      walk(v)
              elif isinstance(x, list):
                  for v in x:
                      walk(v)
          walk(json.load(open(os.path.join(out, 'manifest.json'))))
          for human, f in sorted(found):
              if not human.startswith('duo-'):
                  continue                      # 只发演示数据那几张，真实片库的截图不出这台机器
              name = human.split('_')[0]
              subprocess.run(['sips', '-s', 'format', 'jpeg', '-s', 'formatOptions', '72', '--resampleWidth', '600',
                              os.path.join(out, f), '--out', os.path.join(out, 'pub', name + '.jpg')], check=True, stdout=subprocess.DEVNULL)
              print(name)
          PY
          cd "$OUT/pub"
          [ "$(ls | wc -l)" -gt 0 ] || exit 0
          echo "${GITHUB_SHA} run ${{ github.run_number }}" > SOURCE
          git init -q . && git checkout -q -b demo
          git add -A
          git -c user.name=ios-preview -c user.email=ios-preview@users.noreply.github.com commit -qm "iOS Duo demo preview ${GITHUB_SHA::7}"
          git push -qf "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:refs/ci/ios-preview-demo
          echo "已提交到 refs/ci/ios-preview-demo"

      - name: 导出截图（只在手动运行并勾选时）
        if: always() && github.event_name == 'workflow_dispatch' && inputs.screenshots
        run: |
          OUT="$RUNNER_TEMP/shots"
          mkdir -p "$OUT"
          test -d "$RUNNER_TEMP/ui.xcresult" || exit 0
          xcrun xcresulttool export attachments --path "$RUNNER_TEMP/ui.xcresult" --output-path "$OUT"

      - name: 上传截图（3 天后删除）
        if: always() && github.event_name == 'workflow_dispatch' && inputs.screenshots
        uses: actions/upload-artifact@v4
        with:
          name: ios-preview-${{ github.run_number }}
          path: ${{ runner.temp }}/shots
          retention-days: 3
          if-no-files-found: ignore
