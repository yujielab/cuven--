# 在 iOS 模拟器里把 App 主要页面走一遍（ios/CuvenUITests），连生产接口，最后试播一部片。
#
# ⚠︎ 这个仓库是公开的：日志、构建产物、引用任何人都看得到，真实片库的截图却是片库的真实内容。所以：
#   · 日志里只有测试是否通过、诊断日志（播放器状态、数量与耗时、主线程卡顿，不含片名与地址）；
#   · 真实片库的截图默认不上传，只有在 Actions 页手动运行并勾选「上传截图」时才上传，且 3 天后自动删除；
#   · iPhone Duo 那几种形态用演示数据跑（DuoTests：片名、海报、字标都是本地合成的），这部分截图提交到
#     refs/ci/ios-preview-demo（不是分支）：git fetch origin refs/ci/ios-preview-demo && git checkout FETCH_HEAD -- .
#   · 每次运行先删掉以前公开出去的真实片库截图（refs/ci/ios-preview 引用与 ios-preview-* 产物）。
name: iOS Preview

on:
  push:
    branches: ['claude/**']
    paths: ['ios/**', '.github/workflows/ios-preview.yml']
  workflow_dispatch:
    inputs:
      screenshots:
        description: '上传截图（仓库公开：截图里是片库内容，3 天后自动删除）'
        type: boolean
        default: false

permissions:
  contents: write
  actions: write

concurrency:
  group: ios-preview-${{ github.ref }}
  cancel-in-progress: true

jobs:
  preview:
    # iOS 27.1 SDK 才有 iPhone Duo 的系统行为（竖向栏移到侧边、内容铺到状态栏 / 摄像头那一列底下），
    # 也只有这个镜像里有「iPhone Duo」模拟器
    runs-on: xcode-27
    timeout-minutes: 50
    steps:
      - name: 清理以前公开出去的截图
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api -X DELETE "repos/$GITHUB_REPOSITORY/git/refs/ci/ios-preview" >/dev/null 2>&1 && echo "已删除 refs/ci/ios-preview" || true
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts?per_page=100" --jq '.artifacts[] | select(.name | startswith("ios-preview-")) | .id' \
            | while read -r id; do gh api -X DELETE "repos/$GITHUB_REPOSITORY/actions/artifacts/$id" >/dev/null && echo "已删除截图产物 $id"; done || true

      - uses: actions/checkout@v4

      - name: 选 Xcode（装着的最新正式版 27.x）
        run: |
          XC=$(ls -d /Applications/Xcode_*.app | grep -E 'Xcode_[0-9]+\.[0-9]+(\.[0-9]+)?\.app$' | grep -viE 'beta|release_candidate|_rc' | sort -V | tail -1)
          echo "使用 $XC"
          sudo xcode-select -s "$XC"
          xcodebuild -version
          xcodebuild -showsdks | grep -i ios || true

      - name: 生成工程（XcodeGen）
        run: |
          HOMEBREW_NO_AUTO_UPDATE=1 HOMEBREW_NO_INSTALL_CLEANUP=1 brew install xcodegen
          cd ios && xcodegen generate

      - name: 选模拟器（iPhone Duo 跑 Duo 测试；最新 iOS 上最大的普通 iPhone 跑真实片库的走查）
        run: |
          python3 - <<'PY' >> "$GITHUB_ENV"
          import json, re, subprocess, sys
          d = json.loads(subprocess.check_output(['xcrun', 'simctl', 'list', 'devices', 'available', '-j']))['devices']
          phone = duo = None
          for rt, devs in d.items():
              m = re.search(r'iOS-(\d+)-(\d+)', rt)
              if not m:
                  continue
              ver = (int(m.group(1)), int(m.group(2)))
              for dv in devs:
                  n = dv['name']
                  if not n.startswith('iPhone'):
                      continue
                  if 'Duo' in n:
                      if duo is None or ver > duo[0]:
                          duo = (ver, dv['udid'], n, rt)
                      continue
                  score = (ver, 'Pro Max' in n, 'Pro' in n, n)
                  if phone is None or score > phone[0]:
                      phone = (score, dv['udid'], n, rt)
          print('PHONE_UDID=' + phone[1])
          print('使用模拟器（走查）', phone[2], phone[3], file=sys.stderr)
          if duo:
              print('DUO_UDID=' + duo[1])
              print('使用模拟器（Duo）', duo[2], duo[3], file=sys.stderr)
          else:
              print('没有 iPhone Duo 模拟器', file=sys.stderr)
          PY

      - name: 先把模拟器开起来（和编译同时进行；刚开机就启动 App 容易超时）
        run: |
          if [ -n "${DUO_UDID:-}" ]; then xcrun simctl boot "$DUO_UDID" 2>&1 || true; fi
          xcrun simctl boot "$PHONE_UDID" 2>&1 || true

      - name: 模拟器能力（折叠 / 姿态相关的 simctl 子命令）
        run: |
          xcrun simctl list devicetypes | grep -i -E 'duo|fold' || true
          xcrun simctl help 2>&1 | sed -n '1,80p'
          echo "---- simctl help ui"; xcrun simctl help ui 2>&1 | sed -n '1,60p'
          echo "---- simctl help io"; xcrun simctl help io 2>&1 | sed -n '55,200p'

      - name: 编译测试包
        run: |
          set -o pipefail
          xcodebuild build-for-testing -project ios/Cuven.xcodeproj -scheme Cuven -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/dd" > "$RUNNER_TEMP/build.log" 2>&1 || {
              grep -E -B2 -A8 "error:|fatal error" "$RUNNER_TEMP/build.log" | head -300; tail -40 "$RUNNER_TEMP/build.log"; exit 1; }
          grep -E "warning:" "$RUNNER_TEMP/build.log" | sort -u | head -60 || true

      - name: iPhone Duo（演示数据）
        if: env.DUO_UDID != ''
        run: |
          set +e
          xcrun simctl bootstatus "$DUO_UDID" -b > /dev/null 2>&1
          xcodebuild test-without-building -project ios/Cuven.xcodeproj -scheme Cuven -derivedDataPath "$RUNNER_TEMP/dd" \
            -destination "id=$DUO_UDID" -only-testing:CuvenUITests/DuoDeviceTests \
            -resultBundlePath "$RUNNER_TEMP/duo.xcresult" > "$RUNNER_TEMP/duo.log" 2>&1
          code=$?
          grep -E "Test Case|passed|failed|error:|XCTAssert|Failing|DUO " "$RUNNER_TEMP/duo.log" | tail -60
          echo "exit $code"
          if [ $code -ne 0 ]; then tail -40 "$RUNNER_TEMP/duo.log"; fi
          echo "DUO_EXIT=$code" >> "$GITHUB_ENV"
          # 折叠屏有几块屏、各自什么状态（看能不能用 screenConfig 模拟展开 / 转向）
          echo "---- Duo 屏幕"; xcrun simctl io "$DUO_UDID" enumerate 2>&1 | head -120 || true

      - name: iPhone Duo 展开（演示数据；关掉外屏、打开内屏，只是试探，不算失败）
        if: env.DUO_UDID != ''
        run: |
          set +e
          xcrun simctl io "$DUO_UDID" screenConfig --display=primary-1 power on
          xcrun simctl io "$DUO_UDID" screenConfig --display=primary power off
          sleep 5
          xcrun simctl io "$DUO_UDID" enumerate 2>&1 | grep -E "^\s+\([0-9]+\)|Pixel Size|UI Orientation" | head -20
          xcodebuild test-without-building -project ios/Cuven.xcodeproj -scheme Cuven -derivedDataPath "$RUNNER_TEMP/dd" \
            -destination "id=$DUO_UDID" -only-testing:CuvenUITests/DuoUnfoldedTests \
            -resultBundlePath "$RUNNER_TEMP/duo-unfolded.xcresult" > "$RUNNER_TEMP/duo-unfolded.log" 2>&1
          code=$?
          grep -E "Test Case|error:|XCTAssert|DUO " "$RUNNER_TEMP/duo-unfolded.log" | tail -40
          echo "exit $code"
          xcrun simctl io "$DUO_UDID" screenConfig --display=primary power on
          xcrun simctl io "$DUO_UDID" screenConfig --display=primary-1 power off
          xcrun simctl shutdown "$DUO_UDID"
          exit 0

      - name: 走一遍（真实片库，普通 iPhone）
        if: always()
        run: |
          set +e
          xcrun simctl bootstatus "$PHONE_UDID" -b > /dev/null 2>&1
          xcodebuild test-without-building -project ios/Cuven.xcodeproj -scheme Cuven -derivedDataPath "$RUNNER_TEMP/dd" \
            -destination "id=$PHONE_UDID" -only-testing:CuvenUITests/TourTests \
            -resultBundlePath "$RUNNER_TEMP/ui.xcresult" > "$RUNNER_TEMP/test.log" 2>&1
          code=$?
          grep -E "Test Case|passed|failed|error:|XCTAssert|Failing" "$RUNNER_TEMP/test.log" | tail -60
          echo "exit $code"
          if [ $code -ne 0 ]; then tail -40 "$RUNNER_TEMP/test.log"; fi
          [ "${DUO_EXIT:-0}" = "0" ] || { echo "iPhone Duo 测试没通过（exit $DUO_EXIT）"; exit 1; }
          exit $code

      - name: 诊断日志（播放器状态、数量与耗时、主线程卡顿；不含片名与地址）
        if: always()
        run: |
          # App 的 Debug 构建把诊断写在自己容器的 Caches/cuven-diag.log（模拟器的系统日志不留 info 级别）
          diag() { ls -t "$HOME"/Library/Developer/CoreSimulator/Devices/"$1"/data/Containers/Data/Application/*/Library/Caches/cuven-diag.log 2>/dev/null | head -1; }
          if [ -n "${DUO_UDID:-}" ] && f=$(diag "$DUO_UDID") && [ -n "$f" ]; then
            echo "==== iPhone Duo（演示数据）"; grep -v '^ *+ *[0-9.]*s  renders' "$f" | tail -80
          fi
          f=$(diag "$PHONE_UDID")
          if [ -z "$f" ]; then echo "(没有诊断日志)"; exit 0; fi
          echo "==== 真实片库（普通 iPhone）：主线程卡住超过 1 秒 $(grep -c 'main blocked' "$f") 次"
          n=$(grep -n '==== launch' "$f" | grep -v -- '-CuvenDemo YES' | head -1 | cut -d: -f1)
          if [ -n "$n" ]; then tail -n +"$n" "$f" | tail -400; else tail -120 "$f"; fi

      - name: Duo 演示截图（只含合成内容）提交到 refs/ci/ios-preview-demo
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          OUT="$RUNNER_TEMP/demo"
          mkdir -p "$OUT/pub"
          for r in duo duo-unfolded; do
            test -d "$RUNNER_TEMP/$r.xcresult" || continue
            mkdir -p "$OUT/$r"
            xcrun xcresulttool export attachments --path "$RUNNER_TEMP/$r.xcresult" --output-path "$OUT/$r" || true
          done
          python3 - "$OUT" <<'PY'
          import json, os, subprocess, sys
          out = sys.argv[1]
          def walk(x, found):
              if isinstance(x, dict):
                  if 'exportedFileName' in x:
                      found.append((x.get('suggestedHumanReadableName') or '', x['exportedFileName']))
                  for v in x.values():
                      walk(v, found)
              elif isinstance(x, list):
                  for v in x:
                      walk(v, found)
          for sub in ('duo', 'duo-unfolded'):
              d = os.path.join(out, sub)
              manifest = os.path.join(d, 'manifest.json')
              if not os.path.exists(manifest):
                  continue
              found = []
              walk(json.load(open(manifest)), found)
              for human, f in sorted(found):
                  if not human.startswith('duo-'):
                      continue                  # 只发演示数据那几张，真实片库的截图不出这台机器
                  name = human.split('_')[0]
                  subprocess.run(['sips', '-s', 'format', 'jpeg', '-s', 'formatOptions', '72', '--resampleWidth', '600',
                                  os.path.join(d, f), '--out', os.path.join(out, 'pub', name + '.jpg')], check=True, stdout=subprocess.DEVNULL)
                  print(name)
          PY
          cd "$OUT/pub"
          [ "$(ls | wc -l)" -gt 0 ] || exit 0
          echo "${GITHUB_SHA} run ${{ github.run_number }}" > SOURCE
          git init -q . && git checkout -q -b demo
          git add -A
          git -c user.name=ios-preview -c user.email=ios-preview@users.noreply.github.com commit -qm "iOS Duo demo preview ${GITHUB_SHA::7}"
          git push -qf "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:refs/ci/ios-preview-demo
          echo "已提交到 refs/ci/ios-preview-demo"

      - name: 导出截图（只在手动运行并勾选时）
        if: always() && github.event_name == 'workflow_dispatch' && inputs.screenshots
        run: |
          OUT="$RUNNER_TEMP/shots"
          mkdir -p "$OUT"
          test -d "$RUNNER_TEMP/ui.xcresult" || exit 0
          xcrun xcresulttool export attachments --path "$RUNNER_TEMP/ui.xcresult" --output-path "$OUT"

      - name: 上传截图（3 天后删除）
        if: always() && github.event_name == 'workflow_dispatch' && inputs.screenshots
        uses: actions/upload-artifact@v4
        with:
          name: ios-preview-${{ github.run_number }}
          path: ${{ runner.temp }}/shots
          retention-days: 3
          if-no-files-found: ignore
